name: Daily scan and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate report
        env:
          BIYING_LICENSE: ${{ secrets.BIYING_LICENSE }}
          SCAN_TOP_N: 60
          SCAN_HISTORY_DAYS: 120
          SCAN_FLOW_DAYS: 10
          SCAN_FLOW_CANDIDATE_LIMIT: 180
          SCAN_MIN_AMOUNT: 30000000
        run: |
          if [ -n "$BIYING_LICENSE" ]; then
            npm run scan
          else
            npm run scan:sample
          fi

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
