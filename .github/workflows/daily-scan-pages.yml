name: Daily scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate or keep report
        env:
          BIYING_LICENSE: ${{ secrets.BIYING_LICENSE }}
          SCAN_TOP_N: 8
          SCAN_HISTORY_DAYS: 120
          SCAN_FLOW_DAYS: 10
          SCAN_FLOW_CANDIDATE_LIMIT: 180
          SCAN_MIN_AMOUNT: 30000000
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$BIYING_LICENSE" ]; then
              npm run scan
            else
              npm run scan:sample
            fi
          elif [ ! -f public/reports/latest.json ]; then
            npm run scan:sample
          else
            echo "Using committed latest report for push build"
          fi

      - name: Commit latest report
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports/latest.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update daily scan report [skip ci]"
            git push
          fi

      - name: Validate committed report
        if: ${{ github.event_name == 'push' }}
        run: |
          node -e "const r=require('./public/reports/latest.json'); if (!r.picks || !r.meta) process.exit(1); console.log('report ok:', r.meta.tradeDate, r.universe.strong)"

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-share-money-radar-dist
          path: dist

      - name: Configure Pages
        if: ${{ github.event.repository.private == false }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ github.event.repository.private == false }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        if: ${{ github.event.repository.private == false }}
        id: deployment
        uses: actions/deploy-pages@v4
